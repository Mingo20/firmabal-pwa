<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1D21">
<title>FirmAbal — Captura territorial</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://js.puter.com/v2/"></script>
</head>
<body>
<aside id="sidebar" class="sb">
  <div class="sb-brand">
    <img class="logo" src="icons/logo-badge-96.png" width="36" height="36" alt="FirmAbal" style="border-radius:10px">
    <span class="sb-name">FirmAbal</span>
    <button class="iconbtn sb-toggle" id="btnSideToggle" title="Contraer"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
  </div>
  <nav class="sb-links" id="sideLinks"></nav>
  <div class="sb-foot"><span class="sb-name">v4 · prototipo</span></div>
</aside>
<div id="shell">
<header class="topbar">
  <div class="brand">
    <img class="logo" src="icons/logo-badge-96.png" width="32" height="32" alt="FirmAbal" style="border-radius:9px">
    <span>FirmAbal</span>
  </div>
  <div class="tb-actions">
    <button id="btnHelp" class="iconbtn" title="Ayuda"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#1A1D21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 1 1 3.6 2.4c-.9.4-1.1 1-1.1 1.9"/><circle cx="12" cy="17" r=".4" fill="#1A1D21"/></svg></button>
    <button id="btnShare" class="iconbtn" title="Auto registro"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#1A1D21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.4l6.8 4M8.6 10.6l6.8-4"/></svg></button>
  </div>
</header>
<main id="view"></main>
<div id="installBar" class="ib" aria-live="polite">
  <img src="icons/logo-badge-96.png" width="42" height="42" alt="" class="ib-logo">
  <div class="ib-txt"><b>Instale FirmAbal</b><span>Acceso directo, sin navegador</span></div>
  <button class="ib-btn" id="ibGo">Instalar</button>
  <button class="ib-x" id="ibX" aria-label="Cerrar">×</button>
</div>

<nav class="tabbar" id="tabbar"></nav>
</div>
<div class="sheet-mask" id="sheetMask" hidden></div>
<section class="sheet" id="autoSheet" hidden>
  <div class="handle"></div>
  <div class="two"><button class="btn btn-wa" id="btnWa"><svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><path fill="#fff" d="M16 3C8.8 3 3 8.8 3 16c0 2.5.7 4.8 1.9 6.8L3 29l6.4-1.8A13 13 0 0 0 16 29c7.2 0 13-5.8 13-13S23.2 3 16 3zm0 23.7c-2 0-3.9-.6-5.6-1.6l-.4-.2-3.8 1.1 1-3.7-.3-.4A10.7 10.7 0 1 1 16 26.7zm5.9-8c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.2-.2-.3 0-.5.1-.7l.5-.5c.1-.2.2-.3.3-.5.1-.2.1-.4 0-.5l-1-2.3c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1.1 1.1-1.1 2.6s1.1 3 1.3 3.2c.2.2 2.2 3.4 5.3 4.7 3.1 1.3 3.1.9 3.7.8.6-.1 1.9-.8 2.1-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg> WhatsApp</button><button class="btn btn-dark" id="btnQr"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"/></svg> Código QR</button></div>
  <p class="sheet-foot">Comparta para que el ciudadano se registre solo y quedará asociado a usted como su promotor.</p>
</section>
<section class="sheet" id="qrSheet" hidden>
  <div class="handle"></div>
  <div class="sheet-head"><div class="sheet-ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"/></svg></div><div class="sheet-title"><h2>Código QR</h2><p>El ciudadano lo escanea para registrarse solo</p></div>
  <button class="iconbtn" id="btnCloseQr" aria-label="Cerrar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#1A1D21" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="qrBox" style="display:grid;place-items:center;padding:22px 0 8px"></div>
  <button class="btn btn-light" id="btnQrBack">Volver a Auto registro</button>
</section>
<section class="sheet" id="menuSheet" hidden>
  <div class="handle"></div>
  <div class="sheet-head" style="margin-bottom:10px"><img src="icons/logo-badge-96.png" width="36" height="36" alt="FirmAbal" style="border-radius:10px"><div class="sheet-title"><h2>FirmAbal</h2></div>
  <button class="iconbtn" id="btnCloseMenu" aria-label="Cerrar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#1A1D21" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="menugrid" id="menuGrid"></div>
</section>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
